[phases.setup]
nixPkgs = ["jdk17", "gradle", "nodejs_18"]

[phases.install]
cmds = [
  "cd client && npm ci"
]

[phases.build]
cmds = [
  "cd client && npm run build",
  "cd server && chmod +x gradlew && ./gradlew clean build -x test"
]

[start]
cmd = "bash -lc 'find server/src/main/webapp -mindepth 1 -maxdepth 1 ! -name \"WEB-INF\" ! -name \"META-INF\" -exec rm -rf {} + && cp -r client/build/. server/src/main/webapp/ && java -jar server/build/libs/server.jar'"
